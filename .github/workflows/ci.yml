name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # ล็อกเวอร์ชันตรงกับที่ใช้พัฒนาในเครื่อง กัน CI ไปดึง Flutter
          # เวอร์ชันใหม่กว่านี้มาเอง (channel: stable เฉยๆ จะได้ตัวล่าสุด
          # เสมอ ซึ่งอาจมี breaking change ที่ในเครื่องยังไม่เจอ)
          flutter-version: '3.35.5'

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos
